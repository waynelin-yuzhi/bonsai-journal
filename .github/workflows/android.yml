# 打包 Android App（APK）並發佈到 GitHub Releases。
# App 本身只是開啟線上版的外殼，所以一般改版不用重新打包；
# 只有 android-app/ 裡的設定、圖示改變時才會自動重新打包（也可以在 Actions 頁手動執行）。
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安裝 Capacitor
        run: npm ci

      - name: 產生 Android 專案
        run: |
          npx cap add android
          # App 圖示
          cp -r res/. android/app/src/main/res/
          # 相機權限（在 App 裡拍照用）
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # 版本號每次遞增，新版可以直接覆蓋安裝
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: 打包 APK
        run: |
          # 固定的簽名金鑰，新版才能覆蓋安裝舊版
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../bonsai-journal.apk

      - name: 發佈到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android App 1.0.${{ github.run_number }}
          body: |
            盆栽創作紀錄 Android App。
            手機直接下載：https://github.com/waynelin-yuzhi/bonsai-journal/releases/latest/download/bonsai-journal.apk
            App 會開啟線上版，一般改版不需要重新安裝。
          files: android-app/bonsai-journal.apk
          make_latest: true
